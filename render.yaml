services:
  - type: web
    name: recruiting-pipeline-backend
    env: python
    # Tells Render to run commands inside the backend folder
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        # You will need to provide this in the Render dashboard
        sync: false
      - key: N8N_WEBHOOK_URL
        # You will need to provide this in the Render dashboard
        sync: false
